<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/JogoDeCartasOnePiece.css">
    <title>One Piece Battle Card Game</title>
</head>
<body>
    <!-- elementos decorativos -->
    <img src="../img/sunny.png" class="sunny">
    <img src="../img/chapeu.png" class="chapeu">

    <!-- carta esquerda -->
    <div class="espaçoCarta">
        <div class="carta01">
            <img id="imagem1">
            <h1>Nome: <span id="nome1"></span></h1>
            <h2>Poder: <span id="poder1"></span></h2>
            <h3>Recompensa: <span id="recompensa1"></span></h3>
        </div>
    </div>

    <!-- parte central -->
    <div class="divCentral">
        <h1>Vencedor: <span id="vencedor"></span></h1>
        <h2>Sortear Cartas:</h2>

        <button id="jogar">Jogar</button>
    </div>

    <!-- carta direita -->
    <div class="espaçoCarta">
        <div class="carta02">
            <img id="imagem2">
            <h1>Nome: <span id="nome2"></span></h1>
            <h2>Poder: <span id="poder2"></span></h2>
            <h3>Recompensa: <span id="recompensa2"></span></h3>
        </div>
    </div>
    
</body>
    <script src="../js/JogoDeCartasOnePiece.js"></script>
</html>
